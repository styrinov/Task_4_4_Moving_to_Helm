replicaCount: 2
image:
  repository: sergey1981/react-client
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

backend:
  serviceName: todo-backend
  servicePort: 8080  

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 5

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

nodeAntiAffinity:
  enabled: true
  topologyKey: "kubernetes.io/hostname"

ingress:
  enabled: true
  hosts:
    - host: todo.local
      paths:
        - path: /
          pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: traefik

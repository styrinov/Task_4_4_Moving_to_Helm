replicaCount: 2                 # default; set to 3 for stronger fault tolerance
image:
  repository: sergey1981/go-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 5

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 1

nodeAntiAffinity:
  enabled: true
  topologyKey: "kubernetes.io/hostname"
  # This is soft anti-affinity; change requiredDuringSchedulingIgnoredDuringExecution if you prefer hard

env:
  DB_URI: "mongodb://todo-mongodb-0.todo-mongodb-headless:27017"
  #DB_URI: "mongodb://todo:change-me-pass@todo-mongodb-0.todo-mongodb-headless:27017"
  #DB_URI: mongodb://mongo:27017
  DB_NAME: "test"
  DB_COLLECTION_NAME: "todolist"

backup:
  enabled: true
  schedule: "0 0 * * *"
  backupPVC: mongo-backup

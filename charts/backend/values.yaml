replicaCount: 1

image:
  repository: sergey1981/go-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: todo-backend.local
      paths:
        - path: /
          pathType: Prefix
  tls: [] # - secretName: tls-secret, hosts: [todo-backend.local]

config:
  DB_URI: "mongodb://todo:change-me-pass@todo-mongodb.todo-app.svc.cluster.local:27017/test"
  DB_NAME: "test"
  DB_COLLECTION_NAME: "todolist"

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /api/task
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /api/task
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 20

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - todo-backend-backend
        topologyKey: "kubernetes.io/hostname"

# HPA defaults
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
